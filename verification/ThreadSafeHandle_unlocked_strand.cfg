\* The same unlocked `cancel`, with `MutualExclusion` left out so that TLC keeps
\* going past the first symptom and reaches the consequence: a canceller linked
\* after the drain and parked on a lock nobody is left to release. TLC has to
\* report `NoStrandedWaiter` violated; scripts/check-model asserts it does.
SPECIFICATION Spec
CONSTANTS
    Cancellers = {c1, c2}
    CANCEL_HOLDS_LOCK = FALSE
INVARIANTS
    TypeOK
    AtMostOneRun
    NoStrandedWaiter
PROPERTIES
    EveryCancelReturns
    LoopAlwaysFinishes

CHECK_DEADLOCK FALSE
