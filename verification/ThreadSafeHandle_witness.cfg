\* Coverage, not correctness: the protocol as written, checked against an
\* invariant that only holds if no canceller ever parks and is released. TLC has
\* to report `WaiterPathUnreached` violated; scripts/check-model asserts it does,
\* which is what stops the other models passing over a state space that never
\* reaches the waiter list.
SPECIFICATION Spec
CONSTANTS
    Cancellers = {c1, c2}
    CANCEL_HOLDS_LOCK = TRUE
INVARIANTS
    WaiterPathUnreached

CHECK_DEADLOCK FALSE
