\* `cancel` registered with `methodNoArgsUnlocked` instead, so nothing serialises
\* reading the state word against the loop thread draining the waiter list. TLC
\* has to report `MutualExclusion` violated; scripts/check-model asserts it does.
SPECIFICATION Spec
CONSTANTS
    Cancellers = {c1, c2}
    CANCEL_HOLDS_LOCK = FALSE
INVARIANTS
    TypeOK
    AtMostOneRun
    MutualExclusion
    NoStrandedWaiter
PROPERTIES
    EveryCancelReturns
    LoopAlwaysFinishes

CHECK_DEADLOCK FALSE
