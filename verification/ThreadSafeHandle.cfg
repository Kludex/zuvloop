\* The protocol as zig/tshandle.zig has it: `cancel` is registered with
\* `py.methodNoArgs`, so `wrapNoArgs` holds PyCriticalSection(handle) across the
\* call. Every invariant and both liveness properties have to hold.
SPECIFICATION Spec
CONSTANTS
    Cancellers = {c1, c2}
    CANCEL_HOLDS_LOCK = TRUE
INVARIANTS
    TypeOK
    AtMostOneRun
    MutualExclusion
    NoStrandedWaiter
PROPERTIES
    EveryCancelReturns
    LoopAlwaysFinishes

\* The protocol terminates. Every thread having returned is the successful end
\* of a run, not a state TLC should report as a deadlock.
CHECK_DEADLOCK FALSE
