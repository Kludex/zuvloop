[project]
site_name = "zuvloop"
site_description = "A libuv event loop for asyncio, written in Zig."
site_author = "Marcelo Trylesinski"
site_url = "https://zuvloop.marcelotryle.com/"
repo_url = "https://github.com/Kludex/zuvloop"
repo_name = "Kludex/zuvloop"
copyright = """
Copyright &copy; 2026 zuvloop
"""

nav = [
  { "zuvloop" = "index.md" },
  { "Get started" = [
    "usage/install.md",
    "usage/running.md",
  ] },
  { "Using zuvloop" = [
    "usage/networking.md",
    "usage/datagrams.md",
    "usage/subprocesses.md",
    "usage/instrumentation.md",
  ] },
  { "Architecture" = "architecture.md" },
  { "Reference" = [
    "reference/performance.md",
    "reference/compatibility.md",
    "reference/api.md",
  ] },
]

[project.theme]
language = "en"
favicon = "assets/favicon.svg"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/rotate-cw"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "amber"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
