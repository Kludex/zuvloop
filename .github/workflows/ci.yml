name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed trigger a backtest to seed its baseline.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --group dev --group bench

      # A wheel is compiled on whichever machine the job landed on, so a build
      # that defaults to that machine's CPU bakes its instruction set into a
      # published artifact - which then raises SIGILL on an older one. Asserted
      # here rather than at release time, where it would be too late.
      - name: Confirm the build defaults to the baseline CPU
        run: |
          export HATCH_ZIG_PYTHON_INCLUDE="$(uv run python -c 'import sysconfig; print(sysconfig.get_path("include"))')"
          HATCH_ZIG_EXT_SUFFIX=".cpucheck-default.so" zig build -Doptimize=ReleaseFast
          HATCH_ZIG_EXT_SUFFIX=".cpucheck-baseline.so" zig build -Doptimize=ReleaseFast -Dcpu=baseline
          if ! cmp -s zuvloop/_zuvloop.cpucheck-default.so zuvloop/_zuvloop.cpucheck-baseline.so; then
            echo "::error::A default build differs from -Dcpu=baseline, so it is compiling for this" \
                 "runner's CPU. A wheel built that way raises SIGILL on older machines. See the" \
                 "standardTargetOptions default in build.zig."
            exit 1
          fi
          rm -f zuvloop/_zuvloop.cpucheck-*.so

      - name: Lint and format Python
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Install ZLint
        if: runner.os == 'Linux'
        run: |
          curl -fsSL \
            https://github.com/DonIsaac/zlint/releases/download/v0.9.1/zlint-linux-x86_64 \
            -o /tmp/zlint
          printf '%s  %s\n' \
            3290bd511d37e4f6ccca3621b9894cd6c378195cdaac27520d0bd894058b2b9b \
            /tmp/zlint | sha256sum -c -
          chmod +x /tmp/zlint
          echo /tmp >> "$GITHUB_PATH"

      - name: Lint and format Zig
        if: runner.os == 'Linux'
        run: ./scripts/check-zig

      - name: Type check
        run: uv run mypy

      - name: Test
        run: |
          uv run coverage run -m pytest
          uv run coverage report


  # musl has only ever been compiled for, never run. It is a different libc under
  # the same Zig `std.c` shapes - a third of the published wheels - and the class
  # of defect that keeps reaching users is exactly the one a host cannot see.
  #
  # Alpine runs in a plain container rather than as a job `container:`, because
  # the Actions runner needs a glibc Node to start one and Alpine has none. Zig
  # is fetched as its own static tarball for the same reason.
  musl:
    runs-on: ubuntu-latest

    steps:
      # The workspace is mounted into a container that then runs package code
      # from the index, and a persisted token would be sitting in `.git/config`
      # where that code could read it. Nothing here pushes.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Test under musl
        run: |
          docker run --rm -v "$PWD:/src" -w /src python:3.14-alpine sh -euc '
            apk add --no-cache curl xz build-base openssl

            # Checked against the digest ziglang.org publishes for this exact
            # tarball, because nothing else here verifies what the pipe carries -
            # `setup-zig` does its own checking and cannot run in this container.
            curl -fsSLO https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig-x86_64-linux-0.16.0.tar.xz" \
              | sha256sum -c -
            tar -xJf zig-x86_64-linux-0.16.0.tar.xz -C /opt
            rm zig-x86_64-linux-0.16.0.tar.xz
            export PATH="/opt/zig-x86_64-linux-0.16.0:$PATH"
            zig version

            pip install --no-cache-dir --quiet uv
            # The interpreter in the image is the one to test against; uv would
            # otherwise fetch a managed build, and those are linked against glibc.
            export UV_PYTHON_PREFERENCE=only-system
            uv sync --python "$(command -v python3)" --group dev --group bench

            uv run python -c "import zuvloop; print(zuvloop.libuv_version())"
            uv run pytest -q
          '


  # The Zig layer reaches libc through `std.c`, whose shape differs per target,
  # and the tests only ever run on the host. Two bugs have shipped that a
  # compile for the other target would have caught on the way in.
  cross-compile:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python 3.14 --group dev

      # The headers are the host's, which is enough: this compiles the Zig, and
      # what differs between targets is `std.c`, not `Python.h`.
      - name: Compile for ${{ matrix.target }}
        run: |
          HATCH_ZIG_PYTHON_INCLUDE="$(uv run python -c 'import sysconfig; print(sysconfig.get_path("include"))')" \
            zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast


  # The wheels are built `ReleaseFast`, which disables every bounds and overflow
  # check, and this layer is where the defects have been. `ReleaseSafe` keeps
  # those checks on, so an index or a cast that is wrong traps here instead of
  # corrupting memory in a release.
  release-safe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        # `bench` carries aiohttp and uvicorn: the framework tests are worth
        # more here than anywhere, with the bounds checks left on.
        run: uv sync --python 3.14 --group dev --group bench

      # Built straight with zig rather than through the wheel hook, which pins
      # `ReleaseFast`. The install step puts it where the package expects.
      - name: Build checked
        run: |
          HATCH_ZIG_PYTHON_INCLUDE="$(uv run python -c 'import sysconfig; print(sysconfig.get_path("include"))')" \
          HATCH_ZIG_EXT_SUFFIX="$(uv run python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')" \
            zig build -Doptimize=ReleaseSafe

      # The job is only a gate if the checked build is the one imported. Were
      # the install path to move, pytest would quietly exercise the wheel's
      # `ReleaseFast` binary and this would still be green. `ReleaseSafe` keeps
      # the panic messages the checks raise; `ReleaseFast` has no checks to
      # raise them.
      - name: Confirm the checks are in the binary under test
        run: |
          imported=$(uv run python -c 'import zuvloop._zuvloop as ext; print(ext.__file__)')
          echo "importing $imported"
          if ! LC_ALL=C grep -qa 'index out of bounds' "$imported"; then
            echo "::error::$imported carries no bounds-check panic message. Either it is not the" \
                 "ReleaseSafe build - check where the build step installed it - or the Zig this" \
                 "workflow pins no longer uses that wording for the panic, in which case the" \
                 "string above is what needs updating."
            exit 1
          fi

      - name: Test
        run: uv run pytest

      # Linux only. On GitHub's macOS runners the connection tests hang - nine of
      # them, all reaching for a socket - and they do so whatever the optimize
      # mode, so it is the runner rather than the checks. That is worth chasing
      # separately; holding this job hostage to it is not.
      - name: Conformance
        if: runner.os == 'Linux'
        run: uv run python scripts/conformance.py


  benchmarks:
    # Pull-request code must never execute in a job that can mint an OIDC token.
    # Pushes record the trusted benchmark after a change lands.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # CodSpeed authenticates over OpenID Connect rather than an upload token,
      # which a public repository does not need.
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python 3.14 --group dev --group bench

      # Walltime, not simulation: an event loop spends its time in syscalls and
      # polling, which instruction counting does not model.
      - uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: uv run --no-sync pytest benchmarks/ --codspeed

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # No Zig, and no project install: the site never imports zuvloop, so a broken
      # link fails here rather than on the deploy that Cloudflare runs.
      - name: Build docs
        run: ./scripts/docs
