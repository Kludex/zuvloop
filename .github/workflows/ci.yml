name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed trigger a backtest to seed its baseline.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --group dev --group bench

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Test
        run: |
          uv run coverage run -m pytest
          uv run coverage report


  # The wheels are built `ReleaseFast`, which disables every bounds and overflow
  # check, and this layer is where the defects have been. `ReleaseSafe` keeps
  # those checks on, so an index or a cast that is wrong traps here instead of
  # corrupting memory in a release.
  release-safe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python 3.14 --group dev

      # Built straight with zig rather than through the wheel hook, which pins
      # `ReleaseFast`. The install step puts it where the package expects.
      - name: Build checked
        run: |
          HATCH_ZIG_PYTHON_INCLUDE="$(uv run python -c 'import sysconfig; print(sysconfig.get_path("include"))')" \
          HATCH_ZIG_EXT_SUFFIX="$(uv run python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')" \
            zig build -Doptimize=ReleaseSafe

      # The job is only a gate if the checked build is the one imported. Were
      # the install path to move, pytest would quietly exercise the wheel's
      # `ReleaseFast` binary and this would still be green. `ReleaseSafe` keeps
      # the panic messages the checks raise; `ReleaseFast` has no checks to
      # raise them.
      - name: Confirm the checks are in the binary under test
        run: |
          imported=$(uv run python -c 'import zuvloop._zuvloop as ext; print(ext.__file__)')
          echo "importing $imported"
          if ! LC_ALL=C grep -qa 'index out of bounds' "$imported"; then
            echo "::error::$imported carries no bounds-check panic message. Either it is not the" \
                 "ReleaseSafe build - check where the build step installed it - or the Zig this" \
                 "workflow pins no longer words that panic the same way, in which case the string" \
                 "above is what needs updating."
            exit 1
          fi

      - name: Test
        run: uv run pytest

      # Linux only. On GitHub's macOS runners the connection tests hang - nine of
      # them, all reaching for a socket - and they do so whatever the optimize
      # mode, so it is the runner rather than the checks. That is worth chasing
      # separately; holding this job hostage to it is not.
      - name: Conformance
        if: runner.os == 'Linux'
        run: uv run python scripts/conformance.py


  benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodSpeed authenticates over OpenID Connect rather than an upload token,
      # which a public repository does not need.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python 3.14 --group dev --group bench

      # Walltime, not simulation: an event loop spends its time in syscalls and
      # polling, which instruction counting does not model.
      - uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: uv run --no-sync pytest benchmarks/ --codspeed

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # No Zig, and no project install: the site never imports zuvloop, so a broken
      # link fails here rather than on the deploy that Cloudflare runs.
      - name: Build docs
        run: ./scripts/docs
