name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed trigger a backtest to seed its baseline.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --group dev --group bench

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Test
        run: |
          uv run coverage run -m pytest
          uv run coverage report


  benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodSpeed authenticates over OpenID Connect rather than an upload token,
      # which a public repository does not need.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python 3.14 --group dev --group bench

      # Walltime, not simulation: an event loop spends its time in syscalls and
      # polling, which instruction counting does not model.
      - uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: uv run --no-sync pytest benchmarks/ --codspeed

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No Zig, and no project install: the site never imports zuvloop, so a broken
      # link fails here rather than on the deploy that Cloudflare runs.
      - name: Build docs
        run: ./scripts/docs
