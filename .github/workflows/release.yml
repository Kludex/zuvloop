name: Release

on:
  push:
    tags: ["v*"]
  # Building without publishing, to check the matrix before cutting a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-13]

    steps:
      - uses: actions/checkout@v7

      # No Zig setup step: the build takes its toolchain from the `ziglang`
      # package named in build-system.requires, which is the only way it can
      # reach inside a manylinux container.
      - uses: pypa/cibuildwheel@v4.2.0

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build --sdist

      # An sdist that cannot build without a system Zig is useless on any
      # platform the wheels miss, so it is installed here with none available.
      - name: Install it with no Zig on PATH
        run: |
          uv venv --python 3.14 /tmp/check
          env PATH="/usr/bin:/bin" VIRTUAL_ENV=/tmp/check uv pip install --no-cache dist/*.tar.gz
          /tmp/check/bin/python -c "import zuvloop; print(zuvloop.libuv_version())"

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # PyPI trusted publishing, so there is no API token to store or rotate.
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.2
