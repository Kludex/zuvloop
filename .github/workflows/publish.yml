name: Publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build-wheels:
    name: "Wheels for ${{ matrix.archs }} on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Linux containers must match the runner architecture. The Apple
        # Silicon runner can also build and test x86_64 wheels under Rosetta.
        include:
          - os: ubuntu-latest
            archs: x86_64
          - os: ubuntu-24.04-arm
            archs: aarch64
          - os: macos-latest
            archs: "x86_64 arm64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # hatch-vcs reads the version off the tags, and the default shallow
          # checkout fetches none of them: the build would stamp the fallback
          # onto a wheel rather than fail, so this has to be the full history.
          fetch-depth: 0

      # cibuildwheel's build[uv] frontend needs uv on PATH; the manylinux
      # containers ship it, the macOS runners do not.
      - uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          enable-cache: false

      # No Zig setup step: the build takes its toolchain from the `ziglang`
      # package named in build-system.requires, which is the only way it can
      # reach inside a manylinux container.
      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_ARCHS: "${{ matrix.archs }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "wheels-${{ matrix.os }}"
          path: wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # hatch-vcs reads the version off the tags, and the default shallow
          # checkout fetches none of them: the build would stamp the fallback
          # onto a wheel rather than fail, so this has to be the full history.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          enable-cache: false

      - name: Build sdist
        run: uv build --sdist

      # An sdist that cannot build without a system Zig is useless on any
      # platform the wheels miss, so it is installed here with none available.
      # PATH is scrubbed for the install only; uv is addressed absolutely so
      # the scrub removes Zig without removing the installer.
      - name: Install it with no Zig on PATH
        run: |
          UV="$(command -v uv)"
          uv venv --python 3.14 /tmp/check
          env PATH="/usr/bin:/bin" VIRTUAL_ENV=/tmp/check "$UV" pip install --no-cache dist/*.tar.gz
          # From outside the repo, so the source tree cannot shadow the install.
          cd /tmp && /tmp/check/bin/python -c "import zuvloop; print(zuvloop.libuv_version())"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: success() && startsWith(github.ref, 'refs/tags/')

    permissions:
      id-token: write # trusted publishing (OIDC), no API token

    environment:
      name: pypi
      url: https://pypi.org/project/zuvloop

    steps:
      - name: Download all distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      - name: Publish to PyPI
        # SHA-pinned like every other action: this step runs with id-token: write
        # (OIDC trusted publishing to real PyPI), so a mutable ref is the highest-
        # value supply-chain target in the repo. Bump with the release tag when
        # updating.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
