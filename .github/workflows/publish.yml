name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# A release must either finish or fail visibly; a second tag must not cancel a
# PyPI upload that may already be in progress.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Confirm the release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          # Release checks must not consume a cache written by untrusted PR code.
          use-cache: false
          version: 0.16.0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: 0.12.3

      - name: Install the locked release test environment
        run: uv sync --locked --python 3.14 --group dev --group bench

      - name: Build with native safety checks
        run: |
          HATCH_ZIG_PYTHON_INCLUDE="$(uv run python -c 'import sysconfig; print(sysconfig.get_path("include"))')" \
          HATCH_ZIG_EXT_SUFFIX="$(uv run python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')" \
            zig build -Doptimize=ReleaseSafe

      - name: Test and run CPython conformance
        run: |
          uv run pytest
          uv run python scripts/conformance.py

  build-wheels:
    name: "Wheels for ${{ matrix.archs }} on ${{ matrix.os }}"
    needs: preflight
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Linux containers must match the runner architecture. The Apple
        # Silicon runner can also build and test x86_64 wheels under Rosetta.
        include:
          - os: ubuntu-latest
            archs: x86_64
          - os: ubuntu-24.04-arm
            archs: aarch64
          - os: macos-latest
            archs: "x86_64 arm64"
          - os: windows-latest
            archs: AMD64
          - os: windows-11-arm
            archs: ARM64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # hatch-vcs reads the version off the tags, and the default shallow
          # checkout fetches none of them: the build would stamp the fallback
          # onto a wheel rather than fail, so this has to be the full history.
          fetch-depth: 0

      # cibuildwheel's uv frontend needs uv on PATH; the manylinux containers
      # ship it, the macOS runners do not.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: 0.12.3

      # The native Zig 0.16 ARM64 Windows compiler crashes on `zig build`.
      # Windows emulates the pinned x86-64 compiler while build.zig explicitly
      # targets ARM64; the other jobs use the `ziglang` build requirement.
      - name: Install x86-64 Zig under emulation
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: ./scripts/setup-zig-x86_64-windows.ps1

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_ARCHS: "${{ matrix.archs }}"
          HATCH_ZIG_TARGET: "${{ matrix.archs == 'ARM64' && 'aarch64-windows' || '' }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "wheels-${{ matrix.os }}"
          path: wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # hatch-vcs reads the version off the tags, and the default shallow
          # checkout fetches none of them: the build would stamp the fallback
          # onto a wheel rather than fail, so this has to be the full history.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: 0.12.3

      - name: Build sdist
        run: uv build --sdist --build-constraints .github/build-constraints.txt --require-hashes

      # An sdist that cannot build without a system Zig is useless on any
      # platform the wheels miss, so it is installed here with none available.
      # PATH is scrubbed for the install only; uv is addressed absolutely so
      # the scrub removes Zig without removing the installer.
      - name: Install it with no Zig on PATH
        run: |
          UV="$(command -v uv)"
          uv venv --python 3.14 /tmp/check
          env PATH="/usr/bin:/bin" VIRTUAL_ENV=/tmp/check "$UV" pip install --no-cache dist/*.tar.gz
          # From outside the repo, so the source tree cannot shadow the install.
          cd /tmp && /tmp/check/bin/python -c "import zuvloop; print(zuvloop.libuv_version())"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    if: success() && startsWith(github.ref, 'refs/tags/')

    permissions:
      attestations: write # persist provenance and SBOM attestations
      artifact-metadata: write # register the attested distributions
      contents: read
      id-token: write # trusted publishing (OIDC), no API token

    environment:
      name: pypi
      url: https://pypi.org/project/zuvloop

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.14"
          version: 0.12.3

      - name: Download all distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      - name: Attest the released distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Generate the release SBOM
        run: |
          uv export --locked --no-dev --format cyclonedx1.5 --preview-features sbom-export \
            --output-file sbom.cdx.json
          uv run --no-project python scripts/finalize_sbom.py sbom.cdx.json \
            --version "${GITHUB_REF_NAME#v}"

      - name: Attest the released distributions with their SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: sbom.cdx.json

      - name: Publish to PyPI
        # SHA-pinned like every other action: this step runs with id-token: write
        # (OIDC trusted publishing to real PyPI), so a mutable ref is the highest-
        # value supply-chain target in the repo. Bump with the release tag when
        # updating.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
