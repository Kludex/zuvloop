name: Native hardening

on:
  pull_request:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: 0.12.3

      - name: Install
        run: uv sync --locked --python 3.14 --group dev --group bench

      - name: Build with native safety checks
        run: |
          HATCH_ZIG_PYTHON_INCLUDE="$(uv run python -c 'import sysconfig; print(sysconfig.get_path("include"))')" \
          HATCH_ZIG_EXT_SUFFIX="$(uv run python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')" \
            zig build -Doptimize=ReleaseSafe -Dsanitize-c=full

      - name: Test with native safety checks
        env:
          PYTHONDEVMODE: "1"
          PYTHONMALLOC: debug
        run: uv run --no-sync pytest -q

      - name: Soak loop lifecycle and resource ownership
        env:
          PYTHONDEVMODE: "1"
          PYTHONMALLOC: debug
        run: uv run --no-sync python scripts/soak.py --cycles 500

  # A `--with-pydebug` interpreter aborts on C-API misuse that a release build silently tolerates.
  debug-interpreter:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: 0.12.3

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: debug-interpreter-cache
        with:
          path: ~/cpython-debug
          key: cpython-debug-3.14.7-shared-ubuntu-24.04

      - name: Build the interpreter
        if: steps.debug-interpreter-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential libssl-dev zlib1g-dev libffi-dev
          curl -fsSL --retry 4 --retry-all-errors \
            https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz -o python.tar.xz
          printf '%s  %s\n' \
            3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81 \
            python.tar.xz | sha256sum -c -
          tar -xf python.tar.xz
          cd Python-3.14.7
          ./configure --prefix="$HOME/cpython-debug" --with-pydebug --enable-shared \
            LDFLAGS="-Wl,-rpath,$HOME/cpython-debug/lib" > /dev/null
          make -j"$(nproc)" > /dev/null
          make install > /dev/null

      - name: Install
        env:
          UV_PROJECT_ENVIRONMENT: .venv-debug
        run: |
          uv sync --locked --no-install-project --python "$HOME/cpython-debug/bin/python3.14d" \
            --group dev --group bench

      - name: Build the extension against it
        run: |
          HATCH_ZIG_PYTHON_INCLUDE="$(.venv-debug/bin/python -c 'import sysconfig; print(sysconfig.get_path("include"))')" \
          HATCH_ZIG_EXT_SUFFIX="$(.venv-debug/bin/python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')" \
            zig build

      - name: Test under it
        run: .venv-debug/bin/python -X faulthandler -m pytest -q

  hardening-gate:
    name: Native hardening gate
    if: always()
    needs: [soak, debug-interpreter]
    runs-on: ubuntu-latest

    steps:
      - name: Require the sanitizer, soak and debug-interpreter jobs
        env:
          SOAK: ${{ needs.soak.result }}
          DEBUG_INTERPRETER: ${{ needs.debug-interpreter.result }}
        run: |
          if [ "$SOAK" != success ] || [ "$DEBUG_INTERPRETER" != success ]; then
            echo "::error::Native hardening ended with: soak=$SOAK" \
                 "debug-interpreter=$DEBUG_INTERPRETER"
            exit 1
          fi
