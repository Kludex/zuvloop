name: Update libuv

on:
  schedule:
    # Monday morning UTC, away from the usual top-of-hour scheduler rush.
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-libuv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      version: ${{ steps.update.outputs.version }}
      signer: ${{ steps.update.outputs.signer }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: update
        name: Download and verify the latest release
        run: ./scripts/update-libuv

      - if: steps.update.outputs.changed == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - if: steps.update.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - if: steps.update.outputs.changed == 'true'
        name: Install
        run: uv sync --python 3.14 --group dev

      - if: steps.update.outputs.changed == 'true'
        name: Test the updated native extension
        run: |
          uv run coverage run -m pytest
          uv run coverage report

      - if: steps.update.outputs.changed == 'true'
        name: Cross-compile every supported target
        run: |
          include="$(uv run python -c 'import sysconfig; print(sysconfig.get_path("include"))')"
          for target in \
            x86_64-linux-gnu aarch64-linux-gnu \
            x86_64-linux-musl aarch64-linux-musl \
            x86_64-macos aarch64-macos
          do
            HATCH_ZIG_PYTHON_INCLUDE="$include" \
              zig build -Dtarget="$target" -Doptimize=ReleaseFast
          done

      - if: steps.update.outputs.changed == 'true'
        name: Package the reviewed update
        env:
          VERSION: ${{ steps.update.outputs.version }}
          SIGNER: ${{ steps.update.outputs.signer }}
        run: |
          git add -A vendor
          # The upstream tree is preserved verbatim, including its whitespace.
          git diff --cached --check -- vendor/README.md
          git diff --cached --binary -- vendor > libuv.patch
          test -s libuv.patch
          printf 'version=%s\nsigner=%s\n' "$VERSION" "$SIGNER" > libuv-update.env

      - if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: libuv-update
          path: |
            libuv.patch
            libuv-update.env
          retention-days: 1

  create-pull-request:
    if: needs.update.outputs.changed == 'true'
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: libuv-update
          path: /tmp/libuv-update

      - name: Push the update and open its pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source /tmp/libuv-update/libuv-update.env
          git apply --binary /tmp/libuv-update/libuv.patch
          git switch -C automation/update-libuv
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor
          git commit -m "Update libuv to ${version}"
          git push --force origin HEAD

          body="$(mktemp)"
          cat > "$body" <<EOF
          Update the vendored libuv release to **${version}**.

          The weekly updater verified the release tarball's detached signature against
          trusted libuv maintainer fingerprint \`${signer}\`, ran the complete test
          suite, and cross-compiled every supported target before opening this PR.
          EOF

          number="$(gh pr list --state open --head automation/update-libuv --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "Update libuv to ${version}" --body-file "$body"
          else
            gh pr create \
              --base main \
              --head automation/update-libuv \
              --title "Update libuv to ${version}" \
              --body-file "$body"
          fi
