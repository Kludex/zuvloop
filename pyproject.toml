[build-system]
requires = ["hatchling", "hatch-ziglang", "ziglang==0.16.0"]
build-backend = "hatchling.build"

[project]
name = "zuvloop"
version = "0.0.1"
description = "A libuv event loop for asyncio, written in Zig."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
# libuv is compiled into the extension, so its licence ships with the wheel.
license-files = ["LICENSE", "vendor/libuv/LICENSE*"]
authors = [{ name = "Marcelo Trylesinski", email = "marcelotryle@gmail.com" }]
keywords = ["asyncio", "libuv", "event-loop", "zig", "uvloop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Zig",
    "Typing :: Typed",
]
dependencies = ["opentelemetry-api>=1.23"]

[project.urls]
Source = "https://github.com/Kludex/zuvloop"

[dependency-groups]
dev = [
    "anyio>=4.6",
    "coverage[toml]>=7.6",
    "mypy>=1.13",
    "opentelemetry-sdk>=1.23",
    "pytest>=8.3",
    "ruff>=0.8",
]
bench = ["aiohttp", "httptools", "pytest-codspeed>=5", "uvicorn", "uvloop>=0.21"]
docs = ["zensical"]

[tool.hatch.build.targets.wheel]
packages = ["zuvloop"]

[tool.hatch.build.targets.wheel.hooks.zig]
package = "zuvloop"
optimize = "ReleaseFast"

[tool.hatch.build.targets.sdist]
include = ["zuvloop", "zig", "vendor", "build.zig", "build.zig.zon", "LICENSE", "README.md"]

[tool.ruff]
line-length = 120
src = [".", "tests"]
# Documentation code blocks render in a narrower column than the source line
# length assumes, so joining them to 120 characters makes them scroll sideways.
extend-exclude = ["vendor", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "FA", "UP", "RUF100"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
strict = true
python_version = "3.14"
files = ["zuvloop", "tests", "benchmarks", "scripts"]
exclude = ["^vendor/"]

[[tool.mypy.overrides]]
module = ["uvloop", "hatchling.*", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hatch_build"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.cibuildwheel]
# Only what the project supports: CPython 3.14 on Linux and macOS. The
# free-threaded build is excluded until the loop's GIL handling is tested
# against one - it saves a thread state and counts nesting, and assumes there is
# a GIL to save.
build = "cp314-*"
skip = "*-musllinux_i686 *t-*"
build-frontend = "build[uv]"
test-command = "python -c \"import zuvloop, asyncio; asyncio.run(asyncio.sleep(0), loop_factory=zuvloop.new_event_loop); print(zuvloop.libuv_version())\""

[tool.cibuildwheel.linux]
# The Zig toolchain comes from PyPI, so the manylinux image needs nothing extra.
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.coverage.run]
source_pkgs = ["zuvloop"]
source = ["tests"]
branch = true

[tool.coverage.paths]
source = ["zuvloop", "*/zuvloop"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
